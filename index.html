<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Skin Analyzer</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#fff;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
nav{border-bottom:1px solid #e2e8f0;padding:14px 20px;font-weight:700}nav span{color:#2563eb}
main{max-width:1050px;margin:auto;padding:28px 16px}h1{margin:0 0 6px;font-size:32px}.sub{color:#475569;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;align-items:start}
.card{border:1px solid #e2e8f0;border-radius:14px;padding:20px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
#drop{display:flex;min-height:300px;border:2px dashed #cbd5e1;border-radius:12px;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#475569;overflow:hidden}
#drop img{max-width:100%;max-height:380px}
button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{background:#94a3b8;cursor:default}
.bar{height:9px;background:#e2e8f0;border-radius:9px;margin:5px 0 12px;overflow:hidden}.bar div{height:100%;background:#2563eb}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px;margin:12px 0;font-weight:600}
.small{font-size:13px;color:#64748b}.row{display:flex;justify-content:space-between;gap:10px}
</style></head><body>
<nav><span>&#9679;</span> AI Skin Analyzer</nav>
<main>
<h1>Skin image screening</h1>
<p class="sub">A student project covering 10 categories. It is not a diagnosis, it can be wrong, and it gives a result even for photos that are not skin.</p>
<div class="grid">
<section class="card">
<label id="drop" for="file">Click or drop a clear, close-up skin photo<br>(on a phone you can use the camera)</label>
<input id="file" type="file" accept="image/*" hidden>
<button id="go" disabled>Loading model...</button>
<p class="small">Your photo stays on your device. It is not uploaded.</p>
</section>
<section class="card" id="out" aria-live="polite">Your result will appear here.</section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.wasm.min.js"></script>
<script>
const INFO = [["Acne / Rosacea", "See a dermatologist if it is painful, scarring or not improving.", ["Wash gently with a mild cleanser, without scrubbing", "Do not squeeze or pick spots", "Use non-comedogenic products and sunscreen", "Note triggers such as heat, spicy food or cosmetics"]], ["Autoimmune / Connective Tissue Disorder", "Please see a doctor soon. These can affect other parts of the body.", ["Protect skin from the sun", "Do not burst blisters", "Note fever, joint pain, tiredness or mouth sores and tell the doctor", "Do not start or stop medicines on your own"]], ["Bacterial / Viral Infection", "See a doctor, urgently if redness is spreading or you have fever.", ["Keep the area clean and covered", "Wash hands after touching it", "Do not share towels, razors or clothes", "Do not scratch or squeeze; avoid close skin contact until checked"]], ["Eczema / Dermatitis", "See a dermatologist if it is widespread, oozing or disturbing sleep.", ["Moisturise often with a fragrance-free cream", "Use lukewarm water and mild soap", "Avoid scratching", "Stay away from suspected irritants or allergens"]], ["Fungal / Parasitic Infection", "See a doctor for the right treatment, especially if others at home itch too.", ["Keep the area clean and dry", "Do not share towels, bedding or clothes", "Wash clothes and bedding regularly", "Avoid using steroid creams without medical advice"]], ["Hair Disorder", "See a dermatologist if hair loss is sudden, patchy or continuing.", ["Avoid tight hairstyles and harsh chemicals", "Limit heat styling", "Keep the scalp clean", "Ask a doctor about checking for deficiencies or thyroid problems"]], ["Hypersensitivity Reaction (rash / hives)", "EMERGENCY (call 112 in India) if there is breathing trouble, swelling of face or throat, or skin blistering or peeling.", ["Avoid the suspected food, product or other trigger", "Tell a doctor about any new medicine", "Use a cool compress and loose clothing", "Do not scratch"]], ["Papulosquamous Disorder (e.g. psoriasis, lichen planus)", "See a dermatologist for diagnosis and long-term care.", ["Moisturise regularly", "Avoid scratching or picking scales", "Manage stress and note triggers", "Avoid smoking and limit alcohol"]], ["Pigmentation / Light-related Disorder", "See a dermatologist if patches are spreading or changing.", ["Use broad-spectrum sunscreen daily", "Cover up in strong sun", "Avoid unprescribed bleaching or steroid creams", "Photograph patches to track changes"]], ["Tumour / Growth (benign OR malignant)", "Get it examined by a dermatologist SOON. This app cannot tell harmless growths from cancer.", ["Do not cut, burn or pick the growth", "Protect it from the sun", "Watch for changes in size, shape, colour or bleeding", "Do not delay because the app result looks mild"]]];
const TEST_ACCURACY = 57.0, LOW_CONFIDENCE = 0.40, S = 224;
const $ = id => document.getElementById(id);
let session, picture;
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/";
ort.env.wasm.numThreads = 1;

Promise.all([...Array(5).keys()].map(n => fetch("model.part" + n).then(r => {if(!r.ok) throw new Error("Missing model.part" + n); return r.arrayBuffer(); }))).then(b => new Blob(b).arrayBuffer()).then(m => ort.InferenceSession.create(new Uint8Array(m))).then(s => { session = s; ready(); })
  .catch(e => { $("go").textContent = "Model failed to load"; $("out").textContent = e.message; });
function ready(){ $("go").disabled = !(session && picture); if(session) $("go").textContent = "Analyze"; }

function choose(file){
  if(!file) return;
  picture = null; ready();
  const img = new Image();
  img.onload = () => { picture = img; $("drop").replaceChildren(img); $("out").textContent = "Press Analyze."; ready(); };
  img.onerror = () => { $("out").textContent = "This file could not be read. Use a JPG or PNG photo."; };
  img.src = URL.createObjectURL(file);
}
$("file").onchange = e => choose(e.target.files[0]);
$("drop").ondragover = e => e.preventDefault();
$("drop").ondrop = e => { e.preventDefault(); choose(e.dataTransfer.files[0]); };

// bilinear resize to 224x224, same method as training; pixel values stay 0-255
function pixels(img){
  const w = img.naturalWidth, h = img.naturalHeight, c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,w,h); g.drawImage(img,0,0);
  const d = g.getImageData(0,0,w,h).data, out = new Float32Array(S*S*3);
  for(let y=0;y<S;y++){
    const sy = Math.max(0,(y+0.5)*h/S-0.5), y0 = Math.floor(sy), y1 = Math.min(y0+1,h-1), fy = sy-y0;
    for(let x=0;x<S;x++){
      const sx = Math.max(0,(x+0.5)*w/S-0.5), x0 = Math.floor(sx), x1 = Math.min(x0+1,w-1), fx = sx-x0;
      for(let k=0;k<3;k++){
        const p = (a,b) => d[(b*w+a)*4+k];
        out[(y*S+x)*3+k] = (p(x0,y0)*(1-fx)+p(x1,y0)*fx)*(1-fy) + (p(x0,y1)*(1-fx)+p(x1,y1)*fx)*fy;
      }
    }
  }
  return out;
}

$("go").onclick = async () => {
  $("go").disabled = true; $("out").textContent = "Analyzing...";
  try{
        const px = pixels(picture);
    let skin = 0;
    for(let n=0;n<px.length;n+=3){
      const r = px[n], g = px[n+1], b = px[n+2];
      const cb = 128 - 0.169*r - 0.331*g + 0.5*b;
      const cr = 128 + 0.5*r - 0.419*g - 0.081*b;
      if(cb >= 77 && cb <= 127 && cr >= 135 && cr <= 180) skin++;
    }
    if(skin / (S*S) < 0.30){
      $("out").innerHTML = '<h2>No skin detected</h2><p>Please upload a clear, close-up photo of skin in good light.</p><p class="small">This is a simple colour check and can be wrong. If this was a skin photo, a dermatologist can still assess it.</p>';
      ready(); return;
    }
    const input = new ort.Tensor("float32", px, [1,S,S,3]);
    const result = await session.run({[session.inputNames[0]]: input});
    show(Array.from(result[session.outputNames[0]].data));
  }catch(e){ $("out").textContent = "Could not analyze: " + e.message; }
  ready();
};

function show(probs){
  const top = probs.map((p,i)=>[p,i]).sort((a,b)=>b[0]-a[0]).slice(0,3);
  const [p,i] = top[0], [name,urgency,steps] = INFO[i];
  const pct = v => (v*100).toFixed(1) + "%";
  const head = p < LOW_CONFIDENCE
    ? '<h2>Not sure</h2><p>The model is not confident. Retake the photo in good light and see a dermatologist if you are worried.</p><div class="note">Get medical help quickly for fever, rapid spreading, severe pain, breathing trouble or a changing mole.</div>'
    : `<div class="small">Possible category</div><h2>${name}</h2><p>Confidence for this image: <b>${pct(p)}</b></p><div class="note">${urgency}</div><h3>Precautions</h3><ul>${steps.map(s=>`<li>${s}</li>`).join("")}</ul>`;
  $("out").innerHTML = head + "<h3>Top 3 matches</h3>" +
    top.map(([v,j]) => `<div class="row"><span>${INFO[j][0]}</span><b>${pct(v)}</b></div><div class="bar"><div style="width:${v*100}%"></div></div>`).join("") +
    `<p class="small">Overall model test accuracy: ${TEST_ACCURACY}%. Confidence is not the chance that the result is correct. See a dermatologist for any real concern.</p>`;
}
</script></body></html>
